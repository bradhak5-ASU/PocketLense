services:
  database:
    image: postgres:17.6
    environment:
      POSTGRES_DB: pocketlense
      POSTGRES_USER: pocketlense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pocketlense-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketlense"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pocketlense-data:
